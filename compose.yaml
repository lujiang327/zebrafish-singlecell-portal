services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      network: host
    image: zebrafish-singlecell-portal-backend:latest
    restart: unless-stopped
    environment:
      H5AD_PATH: /app/annotated_clustered_corrected_doubletRemoved_Zebrafishes.h5ad
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    volumes:
      - ${H5AD_PATH:-./annotated_clustered_corrected_doubletRemoved_Zebrafishes.h5ad}:/app/annotated_clustered_corrected_doubletRemoved_Zebrafishes.h5ad:ro,Z
      - ${AC_H5AD_PATH:-./AC_subtypes_reproduced.h5ad}:/app/AC_subtypes_reproduced.h5ad:ro,Z
      - ${BC_H5AD_PATH:-./bc_9_sample_guca1b_gt2_mikiko_no_contam_26_28.h5ad}:/app/bc_9_sample_guca1b_gt2_mikiko_no_contam_26_28.h5ad:ro,Z
      - ${RGC_H5AD_PATH:-./corrected_RGC_annotated_clustered_corrected_doubletRemoved_Zebrafishes.h5ad}:/app/corrected_RGC_annotated_clustered_corrected_doubletRemoved_Zebrafishes.h5ad:ro,Z
      - ./data/processed:/app/data/processed:ro,Z
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: host
      args:
        VITE_API_BASE: ""
    image: zebrafish-singlecell-portal-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"

  preprocess:
    image: zebrafish-singlecell-portal-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
      network: host
    profiles:
      - tools
    user: "0:0"
    environment:
      H5AD_PATH: /app/annotated_clustered_corrected_doubletRemoved_Zebrafishes.h5ad
    volumes:
      - ${H5AD_PATH:-./annotated_clustered_corrected_doubletRemoved_Zebrafishes.h5ad}:/app/annotated_clustered_corrected_doubletRemoved_Zebrafishes.h5ad:ro,Z
      - ${AC_H5AD_PATH:-./AC_subtypes_reproduced.h5ad}:/app/AC_subtypes_reproduced.h5ad:ro,Z
      - ${BC_H5AD_PATH:-./bc_9_sample_guca1b_gt2_mikiko_no_contam_26_28.h5ad}:/app/bc_9_sample_guca1b_gt2_mikiko_no_contam_26_28.h5ad:ro,Z
      - ${RGC_H5AD_PATH:-./corrected_RGC_annotated_clustered_corrected_doubletRemoved_Zebrafishes.h5ad}:/app/corrected_RGC_annotated_clustered_corrected_doubletRemoved_Zebrafishes.h5ad:ro,Z
      - ./data/processed:/app/data/processed:Z
    command: ["python", "backend/preprocess.py", "--all", "--expression-cache"]
